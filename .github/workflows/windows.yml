name: Windows build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust MSVC
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Test and build portable package
        run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: muyu-windows-x64-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
